[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The newsletter's From line and postal address go out in every email, so
  # they aren't secrets; without this the scan fails the build on the From
  # line written in .env.example.
  SECRETS_SCAN_OMIT_KEYS = "RUSS_NEWSLETTER_FROM,RUSS_NEWSLETTER_ADDRESS"
